name: CI

on:
  push:
    branches: [main, updated]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall backend services
      - run: pytest -q
      - name: Import backend application
        env:
          SECRET_KEY: ci-only-secret-key
          SQLALCHEMY_DATABASE_URI: mysql+asyncmy://user:password@localhost:3306/tournaments
        run: python -c "from backend.app.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
